
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-maven-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-maven-demo
  template:
    metadata:
      labels:
        app: jenkins-maven-demo
    spec:
      containers:
        - name: jenkins-maven-demo
          image: 102186470246.dkr.ecr.ap-south-1.amazonaws.com/jenkins-maven-demo:1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
